<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LootAlert{% endblock %}</title>
</head>
<body>
    <header>
        <h1>LootAlert</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('main.index') }}">Home</a></li>
                <li><a href="{{ url_for('auth.login') }}">Login</a></li>

    <main>

    <footer>

    </footer>
</body>
</html>
